<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#ffffff;
    color:#111111;
    font-family:'Montserrat',Arial,sans-serif;
    line-height:1.7;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
}

.container{
    width:88%;
    max-width:1250px;
    margin:auto;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(0,0,0,.96);
    color:#fff;

    border-bottom:1px solid #333;

    padding:14px 5%;
}

.header-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-logo{
    width:58px;
    height:58px;

    object-fit:contain;

    background:#fff;
    padding:4px;

    border-radius:50%;

    border:1px solid #777;
}

.brand-title{
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:2px;
}

.brand-subtitle{
    font-size:9px;
    letter-spacing:2px;
    color:#aaa;
    margin-top:-3px;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#fff;
    font-size:12px;
    letter-spacing:1px;
    transition:.3s;
}

nav a:hover{
    color:#aaa;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:88vh;

    background:
    linear-gradient(
        rgba(0,0,0,.94),

    color:#fff;

    display:flex;
    align-items:center;

}

.hero-content{
    max-width:1000px;
}

.eyebrow{
    font-size:12px;
    letter-spacing:5px;
    color:#999;
    margin-bottom:25px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;

    font-size:clamp(50px,8vw,95px);

    line-height:.95;

    font-weight:600;

    margin-bottom:35px;
}

.hero h1 span{
    color:#aaa;
}

.hero p{
    max-width:720px;

    color:#d5d5d5;

    font-size:17px;

    line-height:1.9;

    margin-bottom:35px;
}

.btn{
    display:inline-block;

    padding:14px 28px;

    border:1px solid #fff;

    color:#fff;

    margin-right:8px;
    margin-bottom:10px;

    font-size:12px;

    letter-spacing:1px;

    transition:.35s;
}

.btn:hover{
    background:#fff;
    color:#000;
}

   COMMON SECTION
========================= */

section{
    padding:100px 7%;
}

.section-heading{
    text-align:center;

    max-width:800px;

    margin:0 auto 65px;
}

.section-heading h2{
    font-family:'Cormorant Garamond',serif;

    font-size:55px;

    line-height:1;

    margin-bottom:15px;
}

.section-heading p{
    color:#777;
    font-size:14px;
}

========================= */

.mentor{

    color:#fff;

    overflow:hidden;
}

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    border:1px solid #333;

    border-radius:50%;

    top:-150px;
    right:-100px;
}

    max-width:1050px;

    margin:auto;

    display:grid;

    grid-template-columns:300px 1fr;

    gap:65px;

}

    width:250px;
    height:300px;

    margin:auto;

    border:8px solid #fff;

    filter:none;

    box-shadow:0 20px 50px rgba(255,255,255,.08);
}

.mentor-photo h3{
    font-family:'Cormorant Garamond',serif;

    font-size:27px;

    margin-top:18px;
}

.mentor-photo p{
    color:#aaa;

    font-size:12px;

    letter-spacing:1px;
}

.mentor-message{
    border-left:2px solid #fff;

    padding:25px 40px;
}

.mentor-label{
    color:#aaa;

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:15px;
}

.mentor-message h2{
    font-family:'Cormorant Garamond',serif;

    font-size:48px;

    margin-bottom:25px;

}

    font-size:28px;

    margin-top:18px;

.principal-photo p{
    color:#666;

    font-size:12px;

    letter-spacing:1px;

.message{
    background:#fff;

    padding:45px;

    border-left:5px solid #000;

    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.message h3{
    font-family:'Cormorant Garamond',serif;

    font-size:38px;

    margin-bottom:25px;
}

.message p{
    font-size:15px;

    color:#444;

    margin-bottom:18px;
}

.signature{
    margin-top:30px;

    padding-top:20px;

    border-top:1px solid #ddd;

    font-weight:600;

    font-size:13px;
}


/* =========================
   SERVICES
========================= */

    max-width:1200px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;

    position:relative;

    transition:.4s;
}

.service::before{
    content:"";

    top:0;
    left:0;

    width:0;
    height:3px;

    background:#000;

    transition:.4s;
}

.service:hover::before{
    width:100%;
}

.service:hover{
    transform:translateY(-8px);

    box-shadow:0 20px 40px rgba(0,0,0,.12);
}

.service-number{
    font-size:12px;

    color:#999;

    letter-spacing:2px;

    margin-bottom:20px;
}

.service h3{
    font-family:'Cormorant Garamond',serif;

    font-size:30px;

    margin-bottom:15px;
}

.service p{
    color:#555;

    font-size:14px;
}

   SPECIALISTS
========================= */

.specialists{

    color:#fff;

    max-width:1150px;

    gap:20px;

    transition:.4s;

.specialist:hover{

    font-size:28px;

    margin-bottom:12px;

.specialist p{
    color:#aaa;

    font-size:13px;
}

.specialist:hover p{
    color:#444;
}

   ABOUT
========================= */

.about{
    background:#fff;

    text-align:center;
}

.about-content{
    max-width:900px;

    margin:auto;

.about h2{
    font-family:'Cormorant Garamond',serif;

    font-size:60px;

    margin-bottom:20px;
}

.about p{
    color:#555;

    font-size:16px;

    line-height:2;
}
